name: Cloud Functions CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: ESLint
        run: npm run lint
      - name: Production dependency audit (report-only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: CI completion
        if: always()
        run: echo "TypeScript build and ESLint are required; dependency audit is reported separately."
